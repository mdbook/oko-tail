<svg xmlns="http://www.w3.org/2000/svg" class="oko" viewBox="0 0 64 64" role="img" aria-labelledby="oko-t">
  <title id="oko-t">oko's tail</title>
  <style>
    .oko{--oko-fur:#f28c2e;--oko-shade:#d7611f;--oko-tip:#fbeed5;--oko-rim:none}
