    .oko .fur{fill:var(--fox,var(--oko-fur))}
    .oko .shade{fill:var(--fox-shade,var(--oko-shade))}
    .oko .tip{fill:var(--fox-tip,var(--oko-tip))}
    .oko .rim{fill:none;stroke:var(--fox-rim,var(--oko-rim));stroke-width:1.4;stroke-linejoin:round}
  </style>
